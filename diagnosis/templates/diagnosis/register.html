{% extends "diagnosis/auth_base.html" %}
{% block title %}Регистрация{% endblock %}
{% block form_content %}
<h1 class="font-serif text-3xl mb-1">Регистрация</h1>
<p class="text-sm text-[#5b6b60] mb-6">Создайте аккаунт для диагностики растений</p>

<form method="post" class="styled-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="w-full bg-moss text-white font-medium py-3 rounded-lg hover:bg-forest transition-colors">
        Зарегистрироваться
    </button>
</form>

<p class="text-sm text-[#5b6b60] mt-5">
    Уже есть аккаунт? <a href="{% url 'login' %}" class="text-moss hover:underline">Войти</a>
</p>
{% endblock %}
